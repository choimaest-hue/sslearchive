name: CI Build (Vercel Git Deploy)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        run: python scripts/build_site.py --site-url https://ssletv.com --per-page 10 --lanovel-per-page 6

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-site
          path: dist
          if-no-files-found: error
